<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Station</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="weather.css">
</head>
<body>

    <div class="app">

        <header class="header">
            <span class="header__eyebrow">Live conditions</span>
            <h1 class="header__title">Weather Station</h1>
        </header>

        <form class="search-box" id="searchForm">
            <label class="visually-hidden" for="cityInput">City name</label>
            <input type="text" id="cityInput" placeholder="Search a city…" autocomplete="off">
            <button type="submit">Search</button>
        </form>

        <div id="result"></div>

    </div>

    <script src="weather.js"></script>
</body>
</html>
